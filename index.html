<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Union — Menu</title>
<meta name="theme-color" content="#FDFAF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Union Menu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* ── TOKENS ── */
  :root {
    --ink:       #1C1C1A;
    --wood:      #A97C50;
    --sage:      #6B8F5E;
    --moss:      #3D5C36;
    --cream:     #F5EFE6;
    --linen:     #EDE4D8;
    --warm-white:#FDFAF6;
    --muted:     #8A8278;
    --potency:   #5A534C;
    --border:    rgba(28,28,26,0.10);
    --border-warm: rgba(169,124,80,0.25);
    --shadow:    0 2px 12px rgba(28,28,26,0.08);
    --header-h:  68px;
    --ticker-h:  38px;
    --nav-h:     52px;
    --total-top: calc(var(--header-h) + var(--ticker-h) + var(--nav-h));

    /* Type scale — bumped for arm's-length tablet viewing.
       Adjusted again at the tablet breakpoint below. */
    --fs-wordmark:    32px;
    --fs-eyebrow:     9px;
    --fs-ticker:      11px;
    --fs-tab:         11px;
    --fs-section:     10px;   /* format eyebrow above brand */
    --fs-brand:       18px;   /* brand / product-line title */
    --fs-product:     13px;   /* strain name */
    --fs-detail:      11px;
    --fs-price:       13px;
    --tap-min:        40px;
    --page-pad:       16px;
    --col-metric:     3.4rem;
    --col-price:      4.75rem;
    --sativa:         #C4783A;
    --hybrid:         #6B8F5E;
    --indica:         #4A6FA5;
  }

  /* ── TABLET BREAKPOINT (iPad portrait and up) ── */
  @media (min-width: 700px) {
    :root {
      --header-h: 80px;
      --ticker-h: 44px;
      --nav-h:    60px;
      --fs-wordmark: 42px;
      --fs-eyebrow:  11px;
      --fs-ticker:   13px;
      --fs-tab:      13px;
      --fs-section:  10px;
      --fs-brand:    20px;
      --fs-product:  14px;
      --fs-detail:   12px;
      --fs-price:    14px;
      --page-pad:    24px;
      --col-metric:  3.6rem;
      --col-price:   5.25rem;
    }
  }

  /* ── LARGE / LANDSCAPE TABLET (iPad landscape, larger iPads) ── */
  @media (min-width: 1000px) {
    :root {
      --header-h: 88px;
      --ticker-h: 46px;
      --nav-h:    64px;
      --fs-wordmark: 46px;
      --fs-eyebrow:  12px;
      --fs-ticker:   13px;
      --fs-tab:      14px;
      --fs-section:  11px;
      --fs-brand:    22px;
      --fs-product:  14px;
      --fs-detail:   12px;
      --fs-price:    14px;
      --page-pad:    28px;
      --col-metric:  3.75rem;
      --col-price:   5.5rem;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--warm-white);
    color: var(--ink);
    font-family: 'Lato', sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: pan-y;
  }

  /* ── STICKY HEADER ── */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    z-index: 100;
    background: var(--cream);
    border-bottom: 1px solid var(--border-warm);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    box-shadow: var(--shadow);
  }

  .header-left {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .wordmark {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: var(--fs-wordmark);
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .header-sub {
    font-size: var(--fs-eyebrow);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .leaf-mark {
    width: 16px;
    height: 16px;
    background: var(--sage);
    border-radius: 50% 0 50% 0;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* header right: timestamp */
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .timestamp {
    font-size: 10px;
    color: var(--muted);
    font-weight: 300;
    white-space: nowrap;
  }

  #sellwoodTap {
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 4px 6px;
    margin: -4px -6px;
    border-radius: 6px;
    transition: background 0.2s, color 0.2s;
    display: inline-flex;
    align-items: center;
    min-height: var(--tap-min);
  }
  body.edit-mode #sellwoodTap {
    background: var(--ink);
    color: var(--cream);
  }

  /* ── TICKER ── */
  .ticker-wrap {
    position: fixed;
    top: var(--header-h);
    left: 0; right: 0;
    height: var(--ticker-h);
    background: var(--ink);
    overflow: hidden;
    z-index: 99;
    display: flex;
    align-items: center;
  }

  .ticker-track {
    display: flex;
    gap: 0;
    white-space: nowrap;
    animation: ticker-scroll 50s linear infinite;
    will-change: transform;
  }

  .ticker-item {
    padding: 0 40px;
    font-size: var(--fs-ticker);
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--linen);
    flex-shrink: 0;
  }

  .ticker-item::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--wood);
    border-radius: 50%;
    margin-right: 14px;
    vertical-align: middle;
    margin-bottom: 2px;
  }

  @keyframes ticker-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ── TAB NAV ── */
  .tab-nav {
    position: fixed;
    top: calc(var(--header-h) + var(--ticker-h));
    left: 0; right: 0;
    height: var(--nav-h);
    background: var(--linen);
    border-bottom: 1px solid var(--border-warm);
    display: flex;
    align-items: stretch;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    z-index: 98;
  }
  .tab-nav::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 0 22px;
    min-height: var(--tap-min);
    font-family: 'Lato', sans-serif;
    font-size: var(--fs-tab);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab-btn.active {
    color: var(--ink);
    border-bottom-color: var(--wood);
  }

  /* ── CONTENT ── */
  .content-area {
    position: fixed;
    top: var(--total-top);
    left: 0; right: 0;
    bottom: 0;
    overflow: hidden;
  }

  .pages-wrap {
    display: flex;
    width: 500%;
    height: 100%;
    transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .page {
    width: 20%;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 20px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-warm) transparent;
  }

  @media (min-width: 700px) {
    .page { padding: 28px 32px 56px; }
  }

  /* ── PAGE LAYOUT (card grid) ── */
  .page {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-x: hidden;
    min-width: 0;
  }

  .tier-banner {
    background:
      radial-gradient(ellipse 40% 80% at 0% 50%, rgba(107,143,94,0.14) 0%, transparent 70%),
      radial-gradient(ellipse 40% 80% at 100% 50%, rgba(107,143,94,0.14) 0%, transparent 70%),
      linear-gradient(180deg, var(--cream) 0%, var(--linen) 100%);
    border: 1px solid var(--border-warm);
    border-radius: 10px;
    padding: 10px 12px 12px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .tier-title {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 20px;
    margin-bottom: 6px;
  }
  .tier-rows { display: grid; gap: 2px; max-width: 540px; margin: 0 auto; }
  .tier-row {
    display: flex;
    justify-content: center;
    gap: 4px 6px;
    flex-wrap: wrap;
    font-size: 11px;
    line-height: 1.35;
    text-align: center;
  }
  .tier-row strong { font-weight: 700; color: var(--moss); min-width: 2.8em; }

  .sort-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    flex-shrink: 0;
  }
  .sort-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sort-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sort-btn {
    border: 1px solid rgba(28,28,26,0.12);
    background: #f4efe6;
    color: var(--ink);
    font: 700 10px/1 Lato, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sort-btn.active {
    background: var(--ink);
    color: var(--warm-white);
    border-color: var(--ink);
  }

  .card-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
    align-content: start;
    min-width: 0;
    width: 100%;
  }
  @media (min-width: 860px) {
    .card-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card-grid.cols-auto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
    .card-grid .section-block.span-2 { grid-column: 1 / -1; }
  }

  /* Flower tab: one board — type columns + packaged deals always visible */
  .flower-board {
    border: 1px solid var(--border-warm);
    border-radius: 12px;
    overflow: hidden;
    background: rgba(253, 250, 246, 0.97);
    min-width: 0;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .flower-board .card-grid {
    gap: 0;
    flex: 1;
    min-height: 0;
    align-items: stretch;
  }
  .flower-board .section-block {
    border: none;
    border-radius: 0;
    background: transparent;
    max-height: none;
    height: 100%;
    box-shadow: none;
  }
  @media (min-width: 860px) {
    .flower-board .card-grid.cols-3 > .section-block:not(:last-child) {
      border-right: 1px solid rgba(169,124,80,0.14);
    }
  }
  .flower-board .section-label {
    border-radius: 0;
  }
  .flower-deals {
    border-bottom: 1px solid rgba(169,124,80,0.18);
    background: linear-gradient(180deg, var(--linen) 0%, rgba(253,250,246,0.98) 100%);
    padding: 12px 14px 14px;
    min-width: 0;
    flex-shrink: 0;
    order: -1;
  }
  .flower-deals-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .flower-deals-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--wood);
  }
  .flower-deals-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0 28px;
    min-width: 0;
  }
  @media (min-width: 700px) {
    .flower-deals-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1000px) {
    .flower-deals-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .flower-deals .product-row {
    padding-left: 0;
    padding-right: 0;
  }

  /* Shared row templates — keep header + rows in lockstep */
  .cols-flower {
    grid-template-columns:
      minmax(0, 1fr)
      var(--col-metric)
      var(--col-metric)
      minmax(var(--col-price), max-content);
  }
  .cols-detail {
    grid-template-columns:
      minmax(0, 1.15fr)
      minmax(0, 1fr)
      minmax(var(--col-price), max-content);
  }

  /* ── SECTION BLOCKS (cards) ── */
  .section-block {
    background: rgba(253, 250, 246, 0.97);
    border: 1px solid var(--border-warm);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    max-height: min(520px, 70vh);
  }
  .section-block.featured {
    border-color: rgba(169,124,80,0.45);
    box-shadow: 0 0 0 1px rgba(169,124,80,0.12);
  }

  .section-label {
    padding: 10px 12px 8px;
    margin: 0;
    background: linear-gradient(180deg, var(--linen) 0%, rgba(237,228,216,0.45) 100%);
    border-left: 4px solid var(--wood);
    border-bottom: 1px solid rgba(169,124,80,0.12);
    border-radius: 0;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 5;
    flex-shrink: 0;
    min-width: 0;
  }
  .section-block[data-accent="sativa"] .section-label { border-left-color: var(--sativa); }
  .section-block[data-accent="hybrid"] .section-label { border-left-color: var(--hybrid); }
  .section-block[data-accent="indica"] .section-label { border-left-color: var(--indica); }
  .section-block[data-accent="house"] .section-label {
    border-left-color: var(--wood);
    background: linear-gradient(180deg, #f3ebe0 0%, rgba(237,228,216,0.55) 100%);
  }

  .section-label .sl-accent {
    width: 6px;
    height: 6px;
    margin-top: 0.55em;
    background: var(--sage);
    border-radius: 50% 0 50% 0;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .section-block[data-accent="sativa"] .sl-accent { background: var(--sativa); }
  .section-block[data-accent="hybrid"] .sl-accent { background: var(--hybrid); }
  .section-block[data-accent="indica"] .sl-accent { background: var(--indica); }

  .section-label .sl-text { min-width: 0; overflow: hidden; }

  .section-label .brand-format {
    font-size: var(--fs-section);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--wood);
    margin-bottom: 2px;
    line-height: 1.3;
  }

  .section-label .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: var(--fs-brand);
    font-weight: 400;
    font-style: italic;
    letter-spacing: -0.2px;
    color: var(--ink);
    line-height: 1.2;
    text-transform: none;
    overflow-wrap: anywhere;
  }
  .section-block[data-accent="sativa"] .brand-name,
  .section-block[data-accent="hybrid"] .brand-name,
  .section-block[data-accent="indica"] .brand-name {
    font-style: normal;
    font-family: Lato, sans-serif;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 12px;
  }
  .section-block[data-accent="sativa"] .brand-name { color: var(--sativa); }
  .section-block[data-accent="hybrid"] .brand-name { color: var(--hybrid); }
  .section-block[data-accent="indica"] .brand-name { color: var(--indica); }

  .section-label .brand-blurb {
    margin-top: 4px;
    font-size: var(--fs-detail);
    font-weight: 300;
    font-style: normal;
    letter-spacing: 0.01em;
    color: var(--muted);
    line-height: 1.35;
  }
  .section-label .brand-blurb:empty { display: none; }

  .col-head {
    display: grid;
    gap: 6px 8px;
    padding: 8px 12px 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
    min-width: 0;
  }
  .col-head span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .col-head span:not(:first-child) { text-align: right; }

  .section-products {
    flex: 1;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 10px 10px;
    min-width: 0;
  }

  /* ── PRODUCT ROWS ── */
  .product-row {
    display: grid;
    align-items: start;
    gap: 4px 8px;
    padding: 8px 2px;
    min-height: var(--tap-min);
    min-width: 0;
    border-bottom: 1px solid rgba(169,124,80,0.10);
    transition: opacity 0.2s;
  }
  .product-row.cols-default {
    grid-template-columns: minmax(0, 1fr) minmax(var(--col-price), max-content);
  }

  .product-row:last-child { border-bottom: none; }

  .product-row.out-of-stock {
    opacity: 0.35;
  }

  .product-row .toggle-btn {
    min-width: 0;
    overflow: hidden;
  }

  .product-name {
    font-size: var(--fs-product);
    font-weight: 400;
    color: var(--ink);
    line-height: 1.25;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .product-detail {
    font-size: var(--fs-detail);
    font-weight: 400;
    color: var(--potency);
    margin-top: 2px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
  }
  .product-row.cols-detail .product-detail {
    margin-top: 0;
    text-align: right;
  }
  .product-metric {
    font-size: var(--fs-detail);
    font-weight: 400;
    color: var(--potency);
    text-align: right;
    font-variant-numeric: tabular-nums;
    min-width: 0;
    line-height: 1.25;
  }

  .product-price {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: var(--fs-price);
    font-weight: 400;
    color: var(--wood);
    white-space: normal;
    text-align: right;
    line-height: 1.2;
    overflow-wrap: anywhere;
    word-break: break-word;
    min-width: 0;
    max-width: 7.5rem;
    justify-self: end;
  }

  /* ── EDIT MODE ── */
  .edit-mode .product-row {
    cursor: pointer;
    border-radius: 8px;
    padding: 9px 8px;
    margin: 0 -8px;
  }
  .edit-mode .product-row:hover {
    background: rgba(169,124,80,0.07);
  }

  .edit-mode .toggle-btn {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .oos-indicator {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--wood);
    flex-shrink: 0;
  }
  .product-row.out-of-stock .oos-indicator { background: #ccc; }
  .edit-mode .oos-indicator { display: block; }

  /* ── EDIT PANEL ── */
  .edit-panel {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--cream);
    border-top: 1px solid var(--border-warm);
    padding: 16px 20px;
    z-index: 200;
    box-shadow: 0 -4px 20px rgba(28,28,26,0.12);
  }
  .edit-panel.visible { display: block; }

  .edit-panel-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .edit-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 120px;
    min-height: var(--tap-min);
    padding: 12px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border-warm);
    background: var(--warm-white);
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
  }

  .action-btn.primary {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--cream);
  }

  .action-btn:hover { opacity: 0.8; }

  .edit-panel-close {
    position: absolute;
    top: 8px; right: 8px;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1;
    padding: 11px;
    min-width: var(--tap-min);
    min-height: var(--tap-min);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── SETTINGS OVERLAY ── */
  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28,28,26,0.45);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .settings-overlay.visible {
    display: flex;
  }

  .settings-card {
    position: relative;
    background: var(--cream);
    border-radius: 18px;
    border: 1px solid var(--border-warm);
    padding: 28px 24px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(28,28,26,0.25);
  }

  .settings-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .settings-copy {
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .settings-input {
    width: 100%;
    padding: 12px 14px;
    min-height: var(--tap-min);
    border-radius: 10px;
    border: 1.5px solid var(--border-warm);
    background: var(--warm-white);
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .settings-input:focus {
    outline: none;
    border-color: var(--wood);
  }

  .settings-actions {
    display: flex;
    gap: 10px;
  }

  .settings-status {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--sage);
    min-height: 14px;
  }
  .settings-status.error { color: #b5563f; }

  /* ── LOADING STATE ── */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60%;
    gap: 16px;
  }

  .loading-leaf {
    width: 28px;
    height: 28px;
    background: var(--sage);
    border-radius: 50% 0 50% 0;
    transform: rotate(45deg);
    animation: leaf-pulse 1.2s ease-in-out infinite;
  }

  @keyframes leaf-pulse {
    0%, 100% { opacity: 0.3; transform: rotate(45deg) scale(0.85); }
    50%       { opacity: 1;   transform: rotate(45deg) scale(1.1); }
  }

  .loading-text {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── ERROR STATE ── */
  .error-state {
    text-align: center;
    padding: 48px 24px;
  }
  .error-state p {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.7;
  }
  .error-state strong {
    font-weight: 700;
    color: var(--ink);
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
  <div class="header-left">
    <div class="leaf-mark"></div>
    <span class="wordmark">Union</span>
    <span class="header-sub" id="sellwoodTap">Cannabis · Sellwood</span>
  </div>
  <div class="header-right">
    <span class="timestamp" id="timestamp"></span>
  </div>
</header>

<!-- ── TICKER ── -->
<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack">
    <!-- populated by JS -->
  </div>
</div>

<!-- ── TAB NAV ── -->
<nav class="tab-nav" id="tabNav">
  <button class="tab-btn active" onclick="switchTab(0)">Pre-Rolls</button>
  <button class="tab-btn" onclick="switchTab(1)">Packs</button>
  <button class="tab-btn" onclick="switchTab(2)">Flower</button>
  <button class="tab-btn" onclick="switchTab(3)">Vapes</button>
  <button class="tab-btn" onclick="switchTab(4)">Dabs &amp; More</button>
</nav>
<!-- ── PAGES ── -->
<div class="content-area">
  <div class="pages-wrap" id="pagesWrap">
    <div class="page" id="page0"><div class="loading-state"><div class="loading-leaf"></div><p class="loading-text">Loading menu…</p></div></div>
    <div class="page" id="page1"></div>
    <div class="page" id="page2"></div>
    <div class="page" id="page3"></div>
    <div class="page" id="page4"></div>
  </div>
</div>

<!-- ── EDIT PANEL ── -->
<div class="edit-panel" id="editPanel">
  <button class="edit-panel-close" onclick="closeEditPanel()">✕</button>
  <div class="edit-panel-title" id="editPanelTitle">Product name</div>
  <div class="edit-actions">
    <button class="action-btn" onclick="toggleStock()">Toggle In/Out of Stock</button>
    <button class="action-btn primary" onclick="closeEditPanel()">Done</button>
  </div>
</div>

<!-- ── SETTINGS PANEL (sheet connection) ── -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-card">
    <button class="edit-panel-close" onclick="closeSettings()">✕</button>
    <div class="settings-title">Connect Google Sheet</div>
    <p class="settings-copy">Paste your published CSV link below. In Sheets: File → Share → Publish to web → format CSV → Publish, then copy the URL here.</p>
    <input type="text" class="settings-input" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
    <div class="settings-actions">
      <button class="action-btn" onclick="refreshNow()">Refresh Now</button>
      <button class="action-btn primary" onclick="saveSheetUrl()">Connect</button>
    </div>
    <div class="settings-status" id="settingsStatus"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// SHEET CONNECTION — already connected to Union's published sheet below.
// Tap "Sellwood" in the header to toggle Edit mode (for stock toggles).
// Long-press "Sellwood" to open the Sheet connection screen if you ever
// need to point the menu at a different sheet. That choice is saved in
// this browser's local storage, so it persists across reloads on this
// device once hosted on a real domain (e.g. GitHub Pages).
// ══════════════════════════════════════════════════════════════════

const DEFAULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTcWs8IbMa3nXUY6qvmyBqhT-OjIjiag1xwduEDTzg_xQv1Yh2RocwHD00hVk3c8SuDA_ZzuJjdg1Vr/pub?output=csv';
let SHEET_URL = DEFAULT_SHEET_URL;

// ── STATE ──
let menuData    = {};
let tickerItems = [];
let editMode    = false;
let selectedRow = null;
let selectedKey = null;
let currentTab  = 0;
let sortField   = 'price';
let sortDir     = 'desc';
const stockOverrides = {}; // { "tab|section|name": true/false }

// ── TAB MAPPING ──
const TAB_NAMES = ['Pre-Rolls', 'Pre-Roll Packs', 'Flower', 'Vapes', 'Dabs & Tinctures'];
const PAGE_COUNT = 5;

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  updateTimestamp();
  setInterval(updateTimestamp, 60000);
  restoreSheetUrl();
  setupSellwoodTap();
  setupSwipe();
  if (SHEET_URL) {
    loadData();
  } else {
    showSetupMessage();
  }
});

function updateTimestamp() {
  const now = new Date();
  const opts = { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' };
  document.getElementById('timestamp').textContent = now.toLocaleDateString('en-US', opts);
}

// ── SHEET URL PERSISTENCE ──
// Primary: localStorage (survives reloads once hosted on a real domain,
// e.g. GitHub Pages — this is what the iPad will use day to day).
// Fallback: ?sheet= query param, useful for sharing a pre-configured link.
// Both are wrapped defensively since some preview/sandbox contexts block
// localStorage and history.replaceState entirely.
const STORAGE_KEY = 'union_menu_sheet_url';

function restoreSheetUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('sheet');
    if (fromUrl) {
      SHEET_URL = decodeURIComponent(fromUrl);
      return;
    }
  } catch (e) { /* ignore */ }

  try {
    const stored = window.localStorage.getItem(STORAGE_KEY);
    if (stored) SHEET_URL = stored;
  } catch (e) { /* localStorage unavailable in this context */ }
}

function persistSheetUrl(url) {
  try {
    window.localStorage.setItem(STORAGE_KEY, url);
  } catch (e) { /* localStorage unavailable — sheet still works for this session */ }
}

// ── HEADER TAP: Sellwood toggles Edit mode. Long-press opens Sheet settings ──
function setupSellwoodTap() {
  const el = document.getElementById('sellwoodTap');
  let pressTimer = null;
  let longPressed = false;

  const start = () => {
    longPressed = false;
    pressTimer = setTimeout(() => {
      longPressed = true;
      openSettings();
    }, 600);
  };
  const cancel = () => {
    clearTimeout(pressTimer);
  };
  const end = () => {
    clearTimeout(pressTimer);
    if (!longPressed) {
      toggleEditMode();
    }
  };

  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', end, { passive: true });
  el.addEventListener('touchcancel', cancel, { passive: true });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', cancel);
}

// ── DATA LOADING ──
async function loadData() {
  if (!SHEET_URL) { showSetupMessage(); return; }
  try {
    const res  = await fetch(SHEET_URL + (SHEET_URL.includes('?') ? '&' : '?') + 't=' + Date.now());
    const text = await res.text();
    parseCSV(text);
  } catch(e) {
    showSetupMessage('Could not load that sheet. Double check the link is published as CSV.');
  }
}

function refreshNow() {
  const status = document.getElementById('settingsStatus');
  status.classList.remove('error');
  status.textContent = 'Refreshing…';
  loadData().then(() => {
    status.textContent = 'Menu refreshed.';
  });
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) { showSetupMessage('Sheet looks empty — check your published CSV.'); return; }

  const parsed = lines.slice(1).map(line => {
    const cols = csvSplit(line);
    return {
      tab:      cols[0]?.trim() || '',
      section:  cols[1]?.trim() || '',
      name:     cols[2]?.trim() || '',
      detail:   cols[3]?.trim() || '',
      price:    cols[4]?.trim() || '',
      inStock:  (cols[5]?.trim().toUpperCase() !== 'FALSE'),
    };
  });

  tickerItems = parsed.filter(r => r.tab === 'ticker' && r.name).map(r => r.name);
  buildTicker();

  const grouped = {};
  for (const tab of TAB_NAMES) grouped[tab] = {};

  parsed.filter(r => r.tab !== 'ticker').forEach(row => {
    if (!grouped[row.tab]) return;
    // Skip blank/template rows (section spacers + empty "add here" slots in the Sheet).
    // Team can leave empty rows under each section without them showing on the tablet.
    if (!row.name) return;
    if (!grouped[row.tab][row.section]) grouped[row.tab][row.section] = [];
    grouped[row.tab][row.section].push(row);
  });

  menuData = grouped;
  renderAllPages();
}

function csvSplit(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; continue; }
    if (ch === ',' && !inQ) { result.push(cur); cur = ''; continue; }
    cur += ch;
  }
  result.push(cur);
  return result;
}

// ── TICKER ──
function buildTicker() {
  const track = document.getElementById('tickerTrack');
  if (!tickerItems.length) {
    tickerItems = ['Union Cannabis · Sellwood', 'Women-owned · Green Certified', 'Ask a budtender!', 'Come say hello 🌱'];
  }
  const items = [...tickerItems, ...tickerItems, ...tickerItems, ...tickerItems];
  track.innerHTML = items.map(t => `<span class="ticker-item">${t}</span>`).join('');
}

// ── RENDER ──
function renderAllPages() {
  TAB_NAMES.forEach((tabName, i) => {
    renderPage(i, menuData[tabName] || {});
  });
}

/** Split "Full Gram — National Cannabis Co. 1g" → format eyebrow + brand title. */
function splitSectionLabel(secName) {
  const raw = String(secName || '').trim();
  if (!raw) return { format: '', brand: '' };

  let format = '';
  let brand = raw;
  const dash = raw.split(/\s*[—–]\s+/);
  if (dash.length >= 2) {
    format = dash[0].trim();
    brand = dash.slice(1).join(' — ').trim();
  } else {
    const hy = raw.split(/\s+-\s+/);
    if (hy.length >= 2) {
      format = hy[0].trim();
      brand = hy.slice(1).join(' - ').trim();
    }
  }

  // Peel trailing size tokens off the brand into the format line (e.g. "1g", "2fl oz").
  const sizeMatch = brand.match(/^(.*?)\s+(\d+(?:\.\d+)?g|\.\d+g|\d+\s*fl\s*oz)$/i);
  if (sizeMatch) {
    brand = sizeMatch[1].trim();
    const size = sizeMatch[2].replace(/\s+/g, ' ');
    format = format ? `${format} · ${size}` : size;
  }

  return { format, brand: brand || raw };
}

// Short elevating lines under select house brands (customer-facing).
const BRAND_BLURBS = {
  'house rolls': 'Fresh flower · packed from the jars',
};

function brandBlurbFor(brand) {
  const key = String(brand || '').trim().toLowerCase();
  return BRAND_BLURBS[key] || '';
}

function parseFirstPct(detail) {
  if (!detail) return null;
  const m = String(detail).match(/(\d+(?:\.\d+)?)\s*%/);
  return m ? parseFloat(m[1]) : null;
}
function parseCBD(detail) {
  if (!detail) return null;
  const m = String(detail).match(/(\d+(?:\.\d+)?)\s*%\s*CBD/i);
  return m ? parseFloat(m[1]) : null;
}
function parsePriceNum(price) {
  if (!price) return null;
  const m = String(price).match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function fmtPct(n) {
  if (n == null || Number.isNaN(n)) return '—';
  const s = Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, '');
  return s + '%';
}
/** Normalize bare % values to include THC for consistent Potency display. */
function formatPotency(detail) {
  const d = String(detail || '').trim();
  if (!d) return '—';
  if (/\bTHC\b/i.test(d)) return d;
  if (/^\d+(?:\.\d+)?\s*%$/.test(d)) return d + ' THC';
  // Multi-strain packs: "20% / 22% / 18%" → append THC once
  if (/^(?:\d+(?:\.\d+)?\s*%\s*)(?:\/\s*\d+(?:\.\d+)?\s*%\s*)+$/.test(d)) {
    return d.replace(/\s+$/, '') + ' THC';
  }
  return d;
}
function enrichRow(row) {
  return {
    ...row,
    thc: parseFirstPct(row.detail),
    cbd: parseCBD(row.detail),
    priceNum: parsePriceNum(row.price),
  };
}
function sortRows(rows) {
  const mult = sortDir === 'asc' ? 1 : -1;
  return [...rows].map(enrichRow).sort((a, b) => {
    const av = sortField === 'price' ? (a.priceNum ?? -1) : (a.thc ?? -1);
    const bv = sortField === 'price' ? (b.priceNum ?? -1) : (b.thc ?? -1);
    if (av === bv) return a.name.localeCompare(b.name);
    return (av - bv) * mult;
  });
}

function setSortField(field) {
  sortField = field;
  renderAllPages();
}
function setSortDir(dir) {
  sortDir = dir;
  renderAllPages();
}

function renderSortBar() {
  return `<div class="sort-bar" role="group" aria-label="Sort">
    <div class="sort-group">
      <span class="sort-label">Sort by</span>
      <button type="button" class="sort-btn ${sortField === 'price' ? 'active' : ''}" onclick="setSortField('price')">Price</button>
      <button type="button" class="sort-btn ${sortField === 'thc' ? 'active' : ''}" onclick="setSortField('thc')">THC</button>
    </div>
    <div class="sort-group">
      <span class="sort-label">Order</span>
      <button type="button" class="sort-btn ${sortDir === 'desc' ? 'active' : ''}" onclick="setSortDir('desc')">High → Low</button>
      <button type="button" class="sort-btn ${sortDir === 'asc' ? 'active' : ''}" onclick="setSortDir('asc')">Low → High</button>
    </div>
  </div>`;
}

function renderSectionLabel({ title, format, blurb }) {
  const formatHtml = format
    ? `<div class="brand-format">${escHtml(format)}</div>`
    : '';
  const blurbHtml = blurb
    ? `<div class="brand-blurb">${escHtml(blurb)}</div>`
    : `<div class="brand-blurb"></div>`;
  return `<div class="section-label">
      <span class="sl-accent"></span>
      <div class="sl-text">
        ${formatHtml}
        <div class="brand-name">${escHtml(title)}</div>
        ${blurbHtml}
      </div>
    </div>`;
}

function renderProductRow(pageIdx, secName, row, mode) {
  const key = `${pageIdx}|${secName}|${row.name}`;
  const inStock = stockOverrides.hasOwnProperty(key) ? stockOverrides[key] : row.inStock;
  const oos = !inStock ? 'out-of-stock' : '';
  const enriched = enrichRow(row);

  if (mode === 'flower') {
    return `<div class="product-row cols-flower ${oos}" data-key="${escAttr(key)}" onclick="rowClick(this)">
      <div class="toggle-btn">
        <div class="oos-indicator"></div>
        <div class="product-name">${escHtml(row.name)}</div>
      </div>
      <div class="product-metric">${escHtml(fmtPct(enriched.thc))}</div>
      <div class="product-metric">${escHtml(fmtPct(enriched.cbd))}</div>
      <div class="product-price">${escHtml(row.price || '—')}</div>
    </div>`;
  }

  if (mode === 'detail') {
    return `<div class="product-row cols-detail ${oos}" data-key="${escAttr(key)}" onclick="rowClick(this)">
      <div class="toggle-btn">
        <div class="oos-indicator"></div>
        <div class="product-name">${escHtml(row.name)}</div>
      </div>
      <div class="product-detail">${escHtml(formatPotency(row.detail))}</div>
      <div class="product-price">${escHtml(row.price || '—')}</div>
    </div>`;
  }

  return `<div class="product-row cols-default ${oos}" data-key="${escAttr(key)}" onclick="rowClick(this)">
    <div class="toggle-btn">
      <div class="oos-indicator"></div>
      <div>
        <div class="product-name">${escHtml(row.name)}</div>
        ${row.detail ? `<div class="product-detail">${escHtml(formatPotency(row.detail))}</div>` : ''}
      </div>
    </div>
    <div class="product-price">${escHtml(row.price)}</div>
  </div>`;
}

function renderCard({ pageIdx, title, format, blurb, accent, featured, span, mode, items }) {
  const colHead = mode === 'flower'
    ? `<div class="col-head cols-flower"><span>Strain</span><span>THC</span><span>CBD</span><span>Price</span></div>`
    : mode === 'detail'
      ? `<div class="col-head cols-detail"><span>Name</span><span>Potency</span><span>Price</span></div>`
      : '';
  const rowsHtml = sortRows(items).map(row =>
    renderProductRow(pageIdx, row.section || title, row, mode || 'default')
  ).join('');
  return `<div class="section-block ${featured ? 'featured' : ''} ${span || ''}" data-accent="${escAttr(accent || 'wood')}">
    ${renderSectionLabel({ title, format, blurb })}
    ${colHead}
    <div class="section-products">${rowsHtml}</div>
  </div>`;
}

function typeFromSection(sec) {
  const m = String(sec).match(/\((Sativa|Hybrid|Indica)\)/i);
  return m ? m[1].toLowerCase() : null;
}

function withSection(secName, rows) {
  return rows.map(r => ({ ...r, section: r.section || secName }));
}

function renderFlowerPage(pageIdx, sections) {
  const byType = { sativa: [], hybrid: [], indica: [] };
  const other = [];
  for (const [secName, rows] of Object.entries(sections)) {
    const t = typeFromSection(secName);
    const tagged = withSection(secName, rows);
    // Fold all typed deli flower (including Sugartop) into Sativa / Hybrid / Indica.
    if (t && /Deli/i.test(secName)) {
      byType[t].push(...tagged);
    } else {
      other.push({ secName, rows: tagged });
    }
  }

  let html = `
    <section class="tier-banner" aria-label="Deli flower pricing tiers">
      <div class="tier-title">Deli Flower</div>
      <div class="tier-rows">
        <div class="tier-row"><strong>$6/g</strong> $20 ⅛ · $40 ¼ · $80 ½ · $150 oz</div>
        <div class="tier-row"><strong>$9/g</strong> $25 ⅛ · $50 ¼ · $100 ½ · $180 oz</div>
        <div class="tier-row"><strong>$10/g</strong> $30 ⅛ · $60 ¼ · $115 ½ · $210 oz</div>
        <div class="tier-row"><strong>$12/g</strong> $39 ⅛ · $75 ¼ · $150 ½ · $240 oz</div>
      </div>
    </section>
    ${renderSortBar()}
    <div class="flower-board">
      <div class="card-grid cols-3">
        ${renderCard({ pageIdx, title: 'Sativa', accent: 'sativa', mode: 'flower', items: byType.sativa })}
        ${renderCard({ pageIdx, title: 'Hybrid', accent: 'hybrid', mode: 'flower', items: byType.hybrid })}
        ${renderCard({ pageIdx, title: 'Indica', accent: 'indica', mode: 'flower', items: byType.indica })}
      </div>`;

  if (other.length) {
    const dealRows = other.flatMap(({ secName, rows }) => withSection(secName, rows));
    const title = other.length === 1
      ? (splitSectionLabel(other[0].secName).brand || other[0].secName)
      : 'Packaged & Specialty';
    html += `
      <section class="flower-deals" aria-label="${escAttr(title)}">
        <div class="flower-deals-head">
          <div class="flower-deals-title">${escHtml(title)}</div>
        </div>
        <div class="flower-deals-grid">
          ${sortRows(dealRows).map(row => renderProductRow(pageIdx, row.section, row, 'default')).join('')}
        </div>
      </section>`;
  }

  html += `</div>`;
  return html;
}

function renderPreRollsPage(pageIdx, sections) {
  const keys = Object.keys(sections);
  const houseKey = keys.find(k => /House Rolls/i.test(k) && !/Mix/i.test(k));
  const houseMixKey = keys.find(k => /House Mix/i.test(k));
  const rest = keys.filter(k => k !== houseKey && k !== houseMixKey);

  let html = renderSortBar() + `<div class="card-grid cols-auto">`;

  if (houseKey || houseMixKey) {
    const houseRows = [
      ...(houseKey ? withSection(houseKey, sections[houseKey]) : []),
      ...(houseMixKey ? withSection(houseMixKey, sections[houseMixKey]) : []),
    ];
    const { format } = splitSectionLabel(houseKey || houseMixKey);
    html += renderCard({
      pageIdx,
      title: 'House Rolls',
      format: format || 'Half Gram',
      blurb: brandBlurbFor('House Rolls'),
      accent: 'house',
      featured: true,
      span: 'span-2',
      mode: 'detail',
      items: houseRows,
    });
  }

  for (const secName of rest) {
    const { format, brand } = splitSectionLabel(secName);
    const rows = withSection(secName, sections[secName]);
    const mostlyPct = rows.every(r => !r.detail || /^[\d.]+\s*%?$/.test(r.detail.trim()));
    html += renderCard({
      pageIdx,
      title: brand || secName,
      format,
      blurb: brandBlurbFor(brand),
      mode: mostlyPct ? 'flower' : 'detail',
      items: rows,
    });
  }
  html += `</div>`;
  return html;
}

function renderBrandCardsPage(pageIdx, sections) {
  let html = renderSortBar() + `<div class="card-grid cols-auto">`;
  for (const [secName, rows] of Object.entries(sections)) {
    const { format, brand } = splitSectionLabel(secName);
    html += renderCard({
      pageIdx,
      title: brand || secName,
      format,
      blurb: brandBlurbFor(brand),
      mode: 'detail',
      items: withSection(secName, rows),
    });
  }
  html += `</div>`;
  return html;
}

function renderPage(pageIdx, sections) {
  const page = document.getElementById('page' + pageIdx);
  if (!sections || !Object.keys(sections).length) {
    page.innerHTML = `<div class="error-state"><p><strong>No items found</strong>Update your Google Sheet and refresh to see products.</p></div>`;
    return;
  }
  const tabName = TAB_NAMES[pageIdx];
  if (tabName === 'Flower') page.innerHTML = renderFlowerPage(pageIdx, sections);
  else if (tabName === 'Pre-Rolls') page.innerHTML = renderPreRollsPage(pageIdx, sections);
  else page.innerHTML = renderBrandCardsPage(pageIdx, sections);
  page.scrollTop = 0;
}

function showSetupMessage(customMsg) {
  const msg = customMsg || `Tap and hold "Sellwood" in the header to connect your Google Sheet.`;
  for (let i = 0; i < PAGE_COUNT; i++) {
    document.getElementById('page' + i).innerHTML = `
      <div class="error-state">
        <p><strong>Menu not connected</strong>${escHtml(msg)}</p>
      </div>`;
  }
  buildTicker();
}

// ── TAB SWITCHING ──
function switchTab(idx) {
  idx = Math.max(0, Math.min(PAGE_COUNT - 1, idx));
  currentTab = idx;
  document.getElementById('pagesWrap').style.transform = `translateX(-${idx * 20}%)`;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });
  const btn = document.querySelectorAll('.tab-btn')[idx];
  if (btn) btn.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
  const page = document.getElementById('page' + idx);
  if (page) page.scrollTop = 0;
}

// ── SWIPE (category tabs) ──
// Horizontal swipe switches Pre-Rolls / Packs / Flower / …
function setupSwipe() {
  const area = document.getElementById('pagesWrap');
  const wrap = document.querySelector('.content-area');
  let startX = 0, startY = 0, deltaX = 0;
  let dragging = false, axisLocked = null;
  let widthPx = wrap.clientWidth;

  window.addEventListener('resize', () => { widthPx = wrap.clientWidth; });

  wrap.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    deltaX = 0;
    axisLocked = null;
    dragging = true;
    area.style.transition = 'none';
  }, { passive: true });

  wrap.addEventListener('touchmove', e => {
    if (!dragging) return;
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    const dx = x - startX;
    const dy = y - startY;

    if (axisLocked === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axisLocked !== 'x') return; // let vertical scroll happen natively

    deltaX = dx;
    // resist swiping past the first/last page
    let resisted = deltaX;
    if ((currentTab === 0 && deltaX > 0) || (currentTab === PAGE_COUNT - 1 && deltaX < 0)) {
      resisted = deltaX * 0.3;
    }
    const basePct = -(currentTab * 20);
    const dragPct = (resisted / widthPx) * 20;
    area.style.transform = `translateX(${basePct + dragPct}%)`;
  }, { passive: true });

  wrap.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    area.style.transition = 'transform 0.32s cubic-bezier(0.4, 0, 0.2, 1)';
    if (axisLocked === 'x') {
      const threshold = widthPx * 0.16;
      if (deltaX < -threshold && currentTab < PAGE_COUNT - 1) {
        switchTab(currentTab + 1);
      } else if (deltaX > threshold && currentTab > 0) {
        switchTab(currentTab - 1);
      } else {
        switchTab(currentTab); // snap back
      }
    }
    axisLocked = null;
  }, { passive: true });

  wrap.addEventListener('touchcancel', () => {
    dragging = false;
    area.style.transition = 'transform 0.32s cubic-bezier(0.4, 0, 0.2, 1)';
    switchTab(currentTab);
  }, { passive: true });
}

// ── EDIT MODE ──
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
}

function rowClick(el) {
  if (!editMode) return;
  const key = el.dataset.key;
  const name = el.querySelector('.product-name').textContent;
  selectedRow = el;
  selectedKey = key;
  document.getElementById('editPanelTitle').textContent = name;
  document.getElementById('editPanel').classList.add('visible');
}

function toggleStock() {
  if (!selectedRow || !selectedKey) return;
  const isOos = selectedRow.classList.contains('out-of-stock');
  selectedRow.classList.toggle('out-of-stock', !isOos);
  stockOverrides[selectedKey] = isOos; // was oos, now in stock
  closeEditPanel();
}

function closeEditPanel() {
  document.getElementById('editPanel').classList.remove('visible');
  selectedRow = null;
  selectedKey = null;
}

// ── SETTINGS PANEL ──
function openSettings() {
  document.getElementById('sheetUrlInput').value = SHEET_URL || '';
  document.getElementById('settingsStatus').textContent = '';
  document.getElementById('settingsStatus').classList.remove('error');
  document.getElementById('settingsOverlay').classList.add('visible');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('visible');
}

function saveSheetUrl() {
  const val = document.getElementById('sheetUrlInput').value.trim();
  const status = document.getElementById('settingsStatus');
  if (!val) {
    status.textContent = 'Paste a published CSV link first.';
    status.classList.add('error');
    return;
  }
  SHEET_URL = val;
  persistSheetUrl(val);
  status.classList.remove('error');
  status.textContent = 'Connected. Loading menu…';
  loadData().then(() => {
    status.textContent = 'Menu connected and loaded.';
    setTimeout(closeSettings, 900);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;');
}

// Register service worker so Android can install this as a real fullscreen app
// (without it, "Add to Home screen" is just a Chrome bookmark with the URL bar).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
